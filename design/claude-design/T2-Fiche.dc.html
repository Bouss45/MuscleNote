<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Fiche exercice</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 412px; height: 915px; box-sizing: border-box; padding: 40px 20px 0; background: {{c.bg}}; color: {{c.fg}}; font-family: Archivo, 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums lining-nums; display: flex; flex-direction: column; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 48px; margin: 0 -12px">
    <button type="button" aria-label="Retour" style="width: 48px; height: 48px; border: none; border-radius: 24px; background: none; color: {{c.fg}}; display: flex; align-items: center; justify-content: center"><span aria-hidden="true" style="font: 400 24px/1 'Material Symbols Rounded'">arrow_back</span></button>
    <button type="button" aria-label="Plus d'options" style="width: 48px; height: 48px; border: none; border-radius: 24px; background: none; color: {{c.fg}}; display: flex; align-items: center; justify-content: center"><span aria-hidden="true" style="font: 400 24px/1 'Material Symbols Rounded'">more_vert</span></button>
  </div>
  <div style="margin-top: 4px; display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-size: 28px; line-height: 1.1; font-weight: 700; letter-spacing: -0.01em">Développé couché</h1>
    <span style="font-size: 13px; color: {{c.fg2}}">Pecs · 19 séances depuis février</span>
  </div>

  <div style="margin-top: 20px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: {{c.s2}}">
    <button type="button" style="height: 40px; border: none; border-radius: 9px; background: {{c.s3}}; color: {{c.fg}}; font: 700 14px Archivo, sans-serif">1RM estimé</button>
    <button type="button" style="height: 40px; border: none; border-radius: 9px; background: none; color: {{c.fg2}}; font: 600 14px Archivo, sans-serif">Charge max</button>
    <button type="button" style="height: 40px; border: none; border-radius: 9px; background: none; color: {{c.fg2}}; font: 600 14px Archivo, sans-serif">Volume</button>
  </div>

  <div style="margin-top: 28px; display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 13px; color: {{c.fg2}}">Dernière séance · jeu. 5 nov.</span>
    <div style="display: flex; align-items: baseline; gap: 6px"><span style="font-size: 96px; line-height: 0.85; font-weight: 700; font-stretch: 75%; letter-spacing: -0.01em">101,3</span><span style="font-size: 20px; font-weight: 600; color: {{c.fg2}}">kg</span></div>
    <span style="font-size: 15px; font-weight: 600; color: {{c.up}}">+19,0 kg <span style="font-weight: 400; color: {{c.fg2}}">depuis le 12 févr.</span></span>
  </div>

  <svg width="372" height="172" viewBox="0 0 372 172" role="img" aria-label="1RM estimé de février à novembre, de 82,3 à 101,3 kg" style="display: block; margin-top: 20px; overflow: visible">
    <path d="M4.0 136.2 L23.1 117.0 L42.1 103.2 L61.2 97.8 L80.2 97.8 L99.3 93.6 L118.3 79.2 L137.4 79.2 L156.4 75.0 L175.5 60.0 L194.5 60.0 L213.6 79.2 L261.2 97.8 L280.3 60.0 L299.3 56.4 L318.4 40.8 L337.4 40.8 L346.9 37.8 L366.0 22.2" fill="none" stroke="{{c.fg}}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"></path>
    <circle cx="366" cy="22.2" r="4" fill="{{c.fg}}"></circle>
    <text x="4" y="168" font-family="Archivo, sans-serif" font-size="12" fill="{{c.fg2}}">févr.</text>
    <text x="368" y="168" text-anchor="end" font-family="Archivo, sans-serif" font-size="12" fill="{{c.fg2}}">nov.</text>
  </svg>

  <div style="margin-top: 4px; display: flex; justify-content: space-between">
    <button type="button" style="height: 44px; min-width: 48px; border: none; background: none; color: {{c.fg2}}; font: 600 15px Archivo, sans-serif">1M</button>
    <button type="button" style="height: 44px; min-width: 48px; border: none; background: none; color: {{c.fg2}}; font: 600 15px Archivo, sans-serif">3M</button>
    <button type="button" style="height: 44px; min-width: 48px; border: none; background: none; color: {{c.fg2}}; font: 600 15px Archivo, sans-serif">6M</button>
    <button type="button" style="height: 44px; min-width: 48px; border: none; background: none; color: {{c.fg2}}; font: 600 15px Archivo, sans-serif">1A</button>
    <button type="button" style="height: 44px; min-width: 48px; border: none; background: none; color: {{c.fg}}; font: 800 15px Archivo, sans-serif; text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 2px">Tout</button>
  </div>

  <div style="margin-top: 24px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 32px; line-height: 1; font-weight: 700; font-stretch: 75%">80 × 8</span><span style="font-size: 13px; color: {{c.fg2}}">meilleure série</span></div>
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 32px; line-height: 1; font-weight: 700; font-stretch: 75%">80 kg</span><span style="font-size: 13px; color: {{c.fg2}}">charge max</span></div>
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 32px; line-height: 1; font-weight: 700; font-stretch: 75%">1 920</span><span style="font-size: 13px; color: {{c.fg2}}">volume max, kg</span></div>
  </div>

  <div style="margin-top: 36px; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: space-between; align-items: center; height: 40px; margin-bottom: 4px"><h2 style="margin: 0; font-size: 20px; font-weight: 700">Séances</h2><span style="font-size: 14px; font-weight: 600; color: {{c.fg2}}">19</span></div>
    <div style="display: flex; align-items: center; gap: 14px; height: 72px; border-bottom: 1px solid {{c.line}}">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 16px; font-weight: 500">jeu. 5 nov.</span><div style="display: flex; gap: 4px"><span style="font-size: 13px; background: {{c.s2}}; border-radius: 8px; padding: 3px 8px">80 × 8</span><span style="font-size: 13px; background: {{c.s2}}; border-radius: 8px; padding: 3px 8px">80 × 8</span><span style="font-size: 13px; background: {{c.s2}}; border-radius: 8px; padding: 3px 8px">80 × 8</span></div></div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 3px"><span style="font-size: 16px; font-weight: 600">101,3</span><span style="font-size: 13px; font-weight: 600; color: {{c.up}}">Record</span></div>
    </div>
    <div style="display: flex; align-items: center; gap: 14px; height: 72px">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 16px; font-weight: 500">jeu. 22 oct.</span><div style="display: flex; gap: 4px"><span style="font-size: 13px; background: {{c.s2}}; border-radius: 8px; padding: 3px 8px">80 × 7</span><span style="font-size: 13px; background: {{c.s2}}; border-radius: 8px; padding: 3px 8px">80 × 7</span><span style="font-size: 13px; background: {{c.s2}}; border-radius: 8px; padding: 3px 8px">80 × 6</span></div></div>
      <span style="font-size: 16px; font-weight: 600">98,7</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["sombre","clair"],"default":"sombre","section":"Thème"},"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      sombre: { bg: '#0F1012', s1: '#1C1D21', s2: '#2A2C31', s3: '#36383E', line: '#222428', fg: '#F3F3F1', fg2: '#A2A5AB', fg3: '#6F737A', live: '#FFC93D', liveTx: '#FFC93D', onLive: '#17140A', liveDim: '#332C14', up: '#3DD68C', upDim: '#12301F', down: '#FF6B5E', downDim: '#3A1714', inv: '#F3F3F1', onInv: '#0F1012', scrim: 'rgba(0,0,0,0.6)' },
      clair: { bg: '#FFFFFF', s1: '#F2F2F0', s2: '#E7E7E4', s3: '#D9D9D5', line: '#EBEBE8', fg: '#121315', fg2: '#5C5F65', fg3: '#85888E', live: '#FFC93D', liveTx: '#7A5900', onLive: '#17140A', liveDim: '#FFF0C2', up: '#0B7A43', upDim: '#E3F5EA', down: '#C62D22', downDim: '#FCE6E3', inv: '#121315', onInv: '#FFFFFF', scrim: 'rgba(18,19,21,0.4)' }
    };
    return { c: this.props.theme === 'clair' ? P.clair : P.sombre };
  }
}
</script>
</body>
</html>
