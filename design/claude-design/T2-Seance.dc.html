<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Séance en cours</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 412px; height: 915px; box-sizing: border-box; background: {{c.bg}}; color: {{c.fg}}; font-family: Archivo, 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums lining-nums; display: flex; flex-direction: column; overflow: hidden">

  <div style="flex-grow: 1; min-height: 0; overflow: hidden; padding: 40px 20px 0; display: flex; flex-direction: column">

    <div style="display: flex; align-items: center; gap: 4px; height: 48px">
      <button type="button" aria-label="Réduire la séance" style="width: 48px; height: 48px; margin-left: -12px; border: none; border-radius: 24px; background: none; color: {{c.fg}}; display: flex; align-items: center; justify-content: center"><span aria-hidden="true" style="font: 400 24px/1 'Material Symbols Rounded'">keyboard_arrow_down</span></button>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; font-weight: 700">Push</span><span style="font-size: 13px; color: {{c.fg2}}">78,4 kg · 2 / 16 séries</span></div>
      <span style="font-size: 30px; line-height: 1; font-weight: 700; font-stretch: 75%; color: {{c.liveTx}}">17:48</span>
    </div>
    <div style="margin-top: 8px; display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 3px" aria-hidden="true">
      <span style="height: 3px; border-radius: 2px; background: {{c.fg}}"></span><span style="height: 3px; border-radius: 2px; background: {{c.fg}}"></span><span style="height: 3px; border-radius: 2px; background: {{c.s3}}"></span><span style="height: 3px; border-radius: 2px; background: {{c.s3}}"></span><span style="height: 3px; border-radius: 2px; background: {{c.s3}}"></span><span style="height: 3px; border-radius: 2px; background: {{c.s3}}"></span><span style="height: 3px; border-radius: 2px; background: {{c.s3}}"></span><span style="height: 3px; border-radius: 2px; background: {{c.s3}}"></span><span style="height: 3px; border-radius: 2px; background: {{c.s3}}"></span><span style="height: 3px; border-radius: 2px; background: {{c.s3}}"></span><span style="height: 3px; border-radius: 2px; background: {{c.s3}}"></span><span style="height: 3px; border-radius: 2px; background: {{c.s3}}"></span><span style="height: 3px; border-radius: 2px; background: {{c.s3}}"></span><span style="height: 3px; border-radius: 2px; background: {{c.s3}}"></span><span style="height: 3px; border-radius: 2px; background: {{c.s3}}"></span><span style="height: 3px; border-radius: 2px; background: {{c.s3}}"></span>
    </div>

    <div style="margin-top: 24px; display: flex; align-items: center">
      <h1 style="flex-grow: 1; margin: 0; font-size: 22px; font-weight: 700">Développé couché</h1>
      <button type="button" aria-label="Fiche de l'exercice" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: none; color: {{c.fg}}; display: flex; align-items: center; justify-content: center"><span aria-hidden="true" style="font: 400 24px/1 'Material Symbols Rounded'">monitoring</span></button>
      <button type="button" aria-label="Plus d'options" style="width: 44px; height: 44px; margin-right: -10px; border: none; border-radius: 22px; background: none; color: {{c.fg}}; display: flex; align-items: center; justify-content: center"><span aria-hidden="true" style="font: 400 24px/1 'Material Symbols Rounded'">more_vert</span></button>
    </div>
    <div style="margin-top: 8px; display: flex; gap: 8px">
      <span style="display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 12px; background: {{c.s2}}; font-size: 14px"><span aria-hidden="true" style="font: 400 18px/1 'Material Symbols Rounded'; color: {{c.fg2}}">history</span>3 × 8 · 80 kg</span>
      <span style="display: flex; align-items: center; gap: 4px; height: 32px; padding: 0 10px; border-radius: 12px; background: {{c.upDim}}; color: {{c.up}}; font-size: 14px; font-weight: 700"><span aria-hidden="true" style="font: 400 18px/1 'Material Symbols Rounded'">arrow_upward</span>+2,5 kg</span>
    </div>

    <div style="margin-top: 18px; display: grid; grid-template-columns: 22px 60px minmax(0, 1fr) minmax(0, 1fr) 48px; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: {{c.fg2}}"><span>#</span><span>Préc.</span><span>Kg</span><span>Reps</span><span></span></div>
    <div style="display: grid; grid-template-columns: 22px 60px minmax(0, 1fr) minmax(0, 1fr) 48px; gap: 8px; align-items: center; height: 56px; border-bottom: 1px solid {{c.line}}">
      <span style="font-size: 15px; color: {{c.fg2}}">1</span><span style="font-size: 13px; color: {{c.fg2}}">80 × 8</span>
      <span style="font-size: 32px; font-weight: 700; font-stretch: 75%">82,5</span><span style="font-size: 32px; font-weight: 700; font-stretch: 75%">8</span>
      <button type="button" aria-label="Série 1 validée" style="width: 48px; height: 48px; border: none; border-radius: 12px; background: {{c.inv}}; color: {{c.onInv}}; display: flex; align-items: center; justify-content: center"><span aria-hidden="true" style="font: 400 24px/1 'Material Symbols Rounded'">check</span></button>
    </div>
    <div style="display: grid; grid-template-columns: 22px 60px minmax(0, 1fr) minmax(0, 1fr) 48px; gap: 8px; align-items: center; height: 56px; border-bottom: 1px solid {{c.line}}">
      <span style="font-size: 15px; color: {{c.fg2}}">2</span><span style="font-size: 13px; color: {{c.fg2}}">80 × 8</span>
      <span style="font-size: 32px; font-weight: 700; font-stretch: 75%">82,5</span><span style="font-size: 32px; font-weight: 700; font-stretch: 75%">8</span>
      <button type="button" aria-label="Série 2 validée" style="width: 48px; height: 48px; border: none; border-radius: 12px; background: {{c.inv}}; color: {{c.onInv}}; display: flex; align-items: center; justify-content: center"><span aria-hidden="true" style="font: 400 24px/1 'Material Symbols Rounded'">check</span></button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; padding: 12px 0 14px; border-bottom: 1px solid {{c.line}}">
      <div style="display: flex; align-items: flex-end; justify-content: space-between">
        <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: {{c.liveTx}}">Repos</span><span style="font-size: 56px; line-height: 0.85; font-weight: 700; font-stretch: 75%; color: {{c.liveTx}}">1:48</span></div>
        <span style="font-size: 14px; color: {{c.fg2}}; padding-bottom: 2px">sur 2:30</span>
      </div>
      <div style="height: 3px; border-radius: 2px; background: {{c.s3}}; overflow: hidden" aria-hidden="true"><div style="width: 28%; height: 3px; background: {{c.live}}"></div></div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button type="button" style="height: 48px; border: none; border-radius: 12px; background: {{c.s2}}; color: {{c.fg}}; font: 700 15px Archivo, sans-serif">−30 s</button>
        <button type="button" style="height: 48px; border: none; border-radius: 12px; background: {{c.s2}}; color: {{c.fg}}; font: 700 15px Archivo, sans-serif">+30 s</button>
        <button type="button" style="height: 48px; border: none; border-radius: 12px; background: none; color: {{c.fg}}; font: 700 15px Archivo, sans-serif">Passer</button>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 22px 60px minmax(0, 1fr) minmax(0, 1fr) 48px; gap: 8px; align-items: center; height: 56px">
      <span style="font-size: 15px; font-weight: 700">3</span><span style="font-size: 13px; color: {{c.fg2}}">80 × 8</span>
      <span style="display: flex; align-items: center; height: 44px; margin-left: -8px; padding-left: 8px; border-radius: 12px; background: {{c.liveDim}}; font-size: 32px; font-weight: 700; font-stretch: 75%">82,5<span style="width: 2px; height: 26px; margin-left: 2px; background: {{c.liveTx}}"></span></span>
      <span style="font-size: 32px; font-weight: 600; font-stretch: 75%; color: {{c.fg3}}">8</span>
      <button type="button" aria-label="Valider la série 3" style="width: 48px; height: 48px; border: none; border-radius: 12px; background: none; box-shadow: inset 0 0 0 2px {{c.fg3}}"></button>
    </div>
  </div>

  <div style="flex-shrink: 0; box-sizing: border-box; padding: 12px 12px 28px; background: {{c.s1}}; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between; padding-left: 4px">
      <div style="display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: {{c.s2}}">
        <button type="button" style="height: 36px; padding: 0 14px; border: none; border-radius: 9px; background: {{c.s3}}; color: {{c.fg}}; font: 700 14px Archivo, sans-serif">Kg · série 3</button>
        <button type="button" style="height: 36px; padding: 0 14px; border: none; border-radius: 9px; background: none; color: {{c.fg2}}; font: 600 14px Archivo, sans-serif">Reps</button>
      </div>
      <button type="button" aria-label="Fermer le pavé" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: none; color: {{c.fg2}}; display: flex; align-items: center; justify-content: center"><span aria-hidden="true" style="font: 400 24px/1 'Material Symbols Rounded'">keyboard_hide</span></button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
      <button type="button" style="height: 52px; border: none; border-radius: 12px; background: {{c.s2}}; color: {{c.fg}}; font: 600 26px Archivo, sans-serif; font-stretch: 75%">1</button>
      <button type="button" style="height: 52px; border: none; border-radius: 12px; background: {{c.s2}}; color: {{c.fg}}; font: 600 26px Archivo, sans-serif; font-stretch: 75%">2</button>
      <button type="button" style="height: 52px; border: none; border-radius: 12px; background: {{c.s2}}; color: {{c.fg}}; font: 600 26px Archivo, sans-serif; font-stretch: 75%">3</button>
      <button type="button" style="height: 52px; border: none; border-radius: 12px; background: {{c.s3}}; color: {{c.fg}}; font: 700 17px Archivo, sans-serif">−2,5</button>
      <button type="button" style="height: 52px; border: none; border-radius: 12px; background: {{c.s2}}; color: {{c.fg}}; font: 600 26px Archivo, sans-serif; font-stretch: 75%">4</button>
      <button type="button" style="height: 52px; border: none; border-radius: 12px; background: {{c.s2}}; color: {{c.fg}}; font: 600 26px Archivo, sans-serif; font-stretch: 75%">5</button>
      <button type="button" style="height: 52px; border: none; border-radius: 12px; background: {{c.s2}}; color: {{c.fg}}; font: 600 26px Archivo, sans-serif; font-stretch: 75%">6</button>
      <button type="button" style="height: 52px; border: none; border-radius: 12px; background: {{c.s3}}; color: {{c.fg}}; font: 700 17px Archivo, sans-serif">+2,5</button>
      <button type="button" style="height: 52px; border: none; border-radius: 12px; background: {{c.s2}}; color: {{c.fg}}; font: 600 26px Archivo, sans-serif; font-stretch: 75%">7</button>
      <button type="button" style="height: 52px; border: none; border-radius: 12px; background: {{c.s2}}; color: {{c.fg}}; font: 600 26px Archivo, sans-serif; font-stretch: 75%">8</button>
      <button type="button" style="height: 52px; border: none; border-radius: 12px; background: {{c.s2}}; color: {{c.fg}}; font: 600 26px Archivo, sans-serif; font-stretch: 75%">9</button>
      <button type="button" aria-label="Effacer" style="height: 52px; border: none; border-radius: 12px; background: {{c.s3}}; color: {{c.fg}}; display: flex; align-items: center; justify-content: center"><span aria-hidden="true" style="font: 400 24px/1 'Material Symbols Rounded'">backspace</span></button>
      <button type="button" style="height: 52px; border: none; border-radius: 12px; background: {{c.s2}}; color: {{c.fg}}; font: 600 26px Archivo, sans-serif; font-stretch: 75%">,</button>
      <button type="button" style="height: 52px; border: none; border-radius: 12px; background: {{c.s2}}; color: {{c.fg}}; font: 600 26px Archivo, sans-serif; font-stretch: 75%">0</button>
      <button type="button" style="grid-column: span 2; height: 52px; border: none; border-radius: 12px; background: {{c.inv}}; color: {{c.onInv}}; font: 700 16px Archivo, sans-serif; display: flex; align-items: center; justify-content: center; gap: 6px"><span aria-hidden="true" style="font: 400 22px/1 'Material Symbols Rounded'">check</span>Valider la série</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["sombre","clair"],"default":"sombre","section":"Thème"},"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      sombre: { bg: '#0F1012', s1: '#1C1D21', s2: '#2A2C31', s3: '#36383E', line: '#222428', fg: '#F3F3F1', fg2: '#A2A5AB', fg3: '#6F737A', live: '#FFC93D', liveTx: '#FFC93D', onLive: '#17140A', liveDim: '#332C14', up: '#3DD68C', upDim: '#12301F', down: '#FF6B5E', downDim: '#3A1714', inv: '#F3F3F1', onInv: '#0F1012', scrim: 'rgba(0,0,0,0.6)' },
      clair: { bg: '#FFFFFF', s1: '#F2F2F0', s2: '#E7E7E4', s3: '#D9D9D5', line: '#EBEBE8', fg: '#121315', fg2: '#5C5F65', fg3: '#85888E', live: '#FFC93D', liveTx: '#7A5900', onLive: '#17140A', liveDim: '#FFF0C2', up: '#0B7A43', upDim: '#E3F5EA', down: '#C62D22', downDim: '#FCE6E3', inv: '#121315', onInv: '#FFFFFF', scrim: 'rgba(18,19,21,0.4)' }
    };
    return { c: this.props.theme === 'clair' ? P.clair : P.sombre };
  }
}
</script>
</body>
</html>
