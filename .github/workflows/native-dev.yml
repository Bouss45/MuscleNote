name: native-dev

# APK de développement de l'app native : à chaque push sur la branche native, build de l'APK
# release signé puis publication en pré-release GitHub v0.1.<run_number>.
on:
  push:
    branches: [native]
    paths:
      - "android-app/**"
      - ".github/workflows/native-dev.yml"

permissions:
  contents: write # création de la release

concurrency:
  group: native-dev
  cancel-in-progress: false

jobs:
  apk:
    name: APK release signé + pré-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
      TAG: v0.1.${{ github.run_number }}
      APK_NAME: MuscleNote-v0.1.${{ github.run_number }}.apk
    defaults:
      run:
        working-directory: android-app

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            android-app/gradle/libs.versions.toml
            android-app/**/*.gradle.kts
            android-app/gradle/wrapper/gradle-wrapper.properties

      # Tests JVM (validation et migrations de la sauvegarde, stockage) : un échec bloque le build.
      - name: Tests unitaires
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # Le keystore n'existe que dans le dossier temporaire du runner, jamais dans le dépôt.
      - name: Décoder le keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 manquant"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build de l'APK release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew :app:assembleRelease
          -PversionCode="$VERSION_CODE"
          -PversionName="$VERSION_NAME"
          --stacktrace

      # Dépôt public : on vérifie la signature sans afficher le certificat dans les logs.
      - name: Vérifier la signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify "$APK"
          cp "$APK" "$RUNNER_TEMP/$APK_NAME"
          ls -l "$RUNNER_TEMP/$APK_NAME"

      - name: Publier la pré-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Build de développement de l'app native (branche native, commit ${GITHUB_SHA::7})."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Relance d'un même run : on remplace l'APK de la release existante.
            gh release upload "$TAG" "$RUNNER_TEMP/$APK_NAME" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP/$APK_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "MuscleNote 2 v$VERSION_NAME" \
              --notes "$NOTES"
          fi

      - name: Supprimer le keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
